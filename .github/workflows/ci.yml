name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: fmt check
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: wasm-pack build
        run: wasm-pack build crates/gpuboy-wasm --target web --out-dir ../../pkg

      - name: Prepare site
        run: |
          mkdir -p _site/www _site/pkg
          cp www/index.html www/index.js _site/www/
          cp -r pkg/. _site/pkg/
          printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=www/"></head></html>\n' > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
