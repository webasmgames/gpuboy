[package]
name = "gpuboy-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
gpuboy-core = { path = "../gpuboy-core" }
gpuboy-render = { path = "../gpuboy-render" }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "AudioContext",
    "AudioContextOptions",
    "AudioNode",
    "AudioBuffer",
    "AudioProcessingEvent",
    "ScriptProcessorNode",
    "AudioDestinationNode",
    "GainNode",
    "AudioParam",
]

[lints]
workspace = true
